name: build-release

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish (self-contained win-x64)
        run: |
          dotnet publish src/EasyShare.App/EasyShare.App.csproj `
            -c Release -r win-x64 --self-contained `
            -o publish/win-x64

      - name: Read version
        id: version
        shell: powershell
        run: |
          $p = (Get-Content src/EasyShare.App/EasyShare.App.csproj | Select-String '<Version>(.*)</Version>').Matches[0].Groups[1].Value
          echo "version=$p" >> $env:GITHUB_OUTPUT

      - name: Package zip (tagged release)
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          Compress-Archive -Path publish/win-x64/* `
            -DestinationPath "publish/EasyShare-${{ steps.version.outputs.version }}-win-x64.zip"
          echo "asset=EasyShare-${{ steps.version.outputs.version }}-win-x64.zip" >> $env:GITHUB_ENV

      - name: Package zip (nightly)
        if: "!startsWith(github.ref, 'refs/tags/')"
        shell: powershell
        run: |
          Compress-Archive -Path publish/win-x64/* `
            -DestinationPath "publish/EasyShare-nightly-win-x64.zip"
          echo "asset=EasyShare-nightly-win-x64.zip" >> $env:GITHUB_ENV

      - name: Create checksum
        shell: powershell
        run: |
          $hash = (Get-FileHash -Path "publish/$env:asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "publish/$env:asset.sha256" -Value $hash

      - name: Publish tag release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" "publish/$env:asset" "publish/$env:asset.sha256" `
            --repo "${{ github.repository }}" --title "${{ github.ref_name }}" `
            --notes "Automatischer Build. Download und entpacken, dann EasyShare.exe starten."

      - name: Publish nightly release
        if: "!startsWith(github.ref, 'refs/tags/')"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: powershell
        run: |
          gh release delete nightly --yes --repo "${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) { $i = 0 }
          gh release create nightly "publish/$env:asset" "publish/$env:asset.sha256" `
            --prerelease --latest=false --repo "${{ github.repository }}" `
            --title "Nightly" --notes "Automatischer Build von master."